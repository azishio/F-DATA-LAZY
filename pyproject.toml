[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f-data-lazy"
version = "0.1.0"
description = "One-shot containerized pipeline producing the public F-DATA parquet from a raw Fugaku job log dump"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.30",
    "pyarrow>=17",
    "sentence-transformers>=3.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
onnx = ["optimum[onnxruntime]>=1.20"]

[project.scripts]
fdata = "fdata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
